name: Deploy to GitHub Pages

on:
  push:
    branches: [ Bytting-til-github-pages ]
  pull_request:
    branches: [ Bytting-til-github-pages ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./wwwroot